# Membres de l'équipe 3T. Pour ajouter quelqu'un : copier un bloc, adapter, enregistrer.
#
# group : metals | xwi | igs          (voir content/research/*.md, paramètre "group")
# kind  : lead | staff | junior | alumni
#         lead = co-responsables ; junior = doctorants et postdocs ; alumni = anciens membres
# photo    : nom d'un fichier placé dans static/img/team/ (ex. benoit-busser.jpg) ; sans fichier, les initiales s'affichent
# orcid    : identifiant ORCID seul (0000-0000-0000-0000) ; sert au lien ORCID et au script des publications
# web      : page web personnelle, adresse complète (facultatif)
# linkedin : profil LinkedIn, adresse complète (facultatif)
# (les lignes laissées vides n'affichent rien)
# (le script scripts/fetch_publications.py lit aussi le champ orcid)
#
# Sources : présentation HCERES (diapo 4) et dossier SAB 2025. Décisions du 2 nov. 2026 :
# G. Bettega, F. Dalonneau, C. Charrat et E. Fontaine non affichés ; S. Kefs postdoc ; C. Magnin alumni.

