- name: MUSITOX
  funder: Idex Université Grenoble Alpes (CDP), then MUSITOX Platform
  coordinated: true
  group: xwi
  summary: The world's first wave-based imaging platform using conventional X-ray sources, bringing phase-contrast and dark-field imaging from the synchrotron to the laboratory.
  url: /platforms/musitox/

- name: ROOTS
  funder: ANR (PRC)
  coordinated: true
  group: xwi
  summary: Phase-contrast imaging for oral healthcare, comparing conventional cone-beam CT with phase-contrast CT of teeth, gingiva, neurovascular bundles and skin layers.
  partners: AP-HP (Benjamin Salmon) · CarMeN (M. Wiart, C. Capdeville) · Université de Toulouse (P. Monsarrat, P. Kemoun)

- name: DREAMLAND
  funder: ANR (PRC)
  group: xwi
  summary: Multi-scale virtual histology of human fetal organs, combining synchrotron X-ray phase-contrast tomography, MRI and histology.

- name: LINX
  funder: Inserm International Research Project
  coordinated: true
  group: xwi
  summary: International research project on X-ray phase imaging with Monash University and the University of Canterbury.
  partners: Monash University (K. Morgan, D. Paganin) · University of Canterbury (K. Pavlov)

- name: arXimed
  funder: Linksium (SATT Grenoble Alpes), spin-off
  coordinated: true
  group: xwi
  summary: Technology transfer of wave-based X-ray imaging towards clinical systems, starting with dental and maxillofacial imaging. Grand Prix of the i-PhD innovation contest.
  url: https://doctoremmetbrown.github.io/xray-wave-imaging/

