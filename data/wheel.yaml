# Roue de l'accueil (layouts/partials/wheel.html).
# ring  : inner (techniques d'imagerie, anneau sombre) ou outer (applications, anneau clair)
# angle : position en degrés, 0 = en haut, sens horaire
# w, h  : taille de la vignette (en % de la largeur de la roue) ; l'image s'ajuste dedans
# group : metals, xwi ou igs ; l'image renvoie vers la page de ce groupe de recherche (et donne la couleur du point)
# fade  : b = estompe le bas de l'image (quand elle est coupée)
# side  : côté du libellé par rapport à la vignette (t, b, l, r)
# label : « | » force un retour à la ligne
# Les images sont dans static/img/wheel/<id>.png
center:
  - Elucidating disease mechanisms
  - Diagnostic imaging
  - Theranostics (nano)vectors

nodes:
  # --- anneau intérieur : techniques ---
  - {id: swir,              label: "Short Wave|Infra Red",            ring: inner, angle: 0,   w: 10.5,  h: 14,   side: r, group: igs}
  - {id: xray-fluorescence, label: "X-ray|Fluorescence",             ring: inner, angle: 90,  w: 12,   h: 15.5, side: b, group: metals}
  - {id: dark-field,        label: "X-ray Phase Contrast|Dark-field", ring: inner, angle: 180, w: 18,   h: 10.5,   side: b, group: xwi}
  - {id: libs,              label: "Laser Induced Breakdown|Spectroscopy", ring: inner, angle: 270, w: 15, h: 15, side: t, group: metals}
  # --- anneau extérieur : applications ---
  - {id: metallomic,         label: "Metallomic",                    ring: outer, angle: 0,     w: 24, h: 11, side: r, group: metals}
  - {id: virtual-histology,  label: "Virtual|Histology",             ring: outer, angle: 51.4,  w: 16, h: 11.5, side: b, group: xwi}
  - {id: single-cell,        label: "Single cell",                   ring: outer, angle: 102.8, w: 9, h: 12,  side: b, group: metals}
  - {id: image-guided-surgery, label: "Image guided|surgery",        ring: outer, angle: 154.3, w: 8, h: 13.5, side: t, group: igs}
  - {id: functional-imaging, label: "Functional|Imaging",            ring: outer, angle: 205.7, w: 9, h: 13,  side: t, group: xwi, fade: b}
  - {id: bore-neutron,       label: "Boron neutron|capture|therapy", ring: outer, angle: 257.1, w: 8, h: 13.5, side: t, group: igs}
  - {id: cell-therapy,       label: "Cell Therapy|Monitoring",       ring: outer, angle: 308.6, w: 8.5,   h: 13.5, side: r, group: xwi, fade: b}
