{{- /* Liens externes (http/https) : nouvel onglet + rel sécurisé. Les liens internes restent inchangés. */ -}}
{{- $ext := or (strings.HasPrefix .Destination "http://") (strings.HasPrefix .Destination "https://") -}}
<a href="{{ .Destination | safeURL }}"{{ with .Title }} title="{{ . }}"{{ end }}{{ if $ext }} target="_blank" rel="noopener noreferrer"{{ end }}>{{ .Text | safeHTML }}</a>
